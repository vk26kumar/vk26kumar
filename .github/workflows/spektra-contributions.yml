name: Update GitHub Contributions

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Generate combined contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.SPEKTRA_TOKEN }}
        run: |
          python <<'PY'
          import requests
          import datetime
          import html
          import os

          USERS = ["vk26kumar", "vishalk-spektra"]
          OUTPUT = "assets/combined-contributions.svg"

          os.makedirs("assets", exist_ok=True)

          today = datetime.date.today()
          start = today - datetime.timedelta(days=365)

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                      weekday
                    }
                  }
                }
              }
            }
          }
          """

          token = os.environ["GITHUB_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          all_days = {}
          totals = {}

          for username in USERS:
              variables = {
                  "login": username,
                  "from": start.isoformat() + "T00:00:00Z",
                  "to": today.isoformat() + "T23:59:59Z"
              }

              response = requests.post(
                  "https://api.github.com/graphql",
                  json={
                      "query": query,
                      "variables": variables
                  },
                  headers=headers
              )

              if response.status_code != 200:
                  raise Exception(
                      f"GitHub API error for {username}: "
                      f"{response.status_code} {response.text}"
                  )

              data = response.json()

              if "errors" in data:
                  raise Exception(data["errors"])

              calendar = (
                  data["data"]["user"]
                  ["contributionsCollection"]
                  ["contributionCalendar"]
              )

              totals[username] = calendar["totalContributions"]

              for week in calendar["weeks"]:
                  for day in week["contributionDays"]:
                      date = day["date"]
                      count = day["contributionCount"]

                      if date not in all_days:
                          all_days[date] = 0

                      all_days[date] += count

          combined_total = sum(all_days.values())

          print(f"Personal contributions: {totals['vk26kumar']}")
          print(f"Professional contributions: {totals['vishalk-spektra']}")
          print(f"Combined contributions: {combined_total}")

          # GitHub-like graph dimensions
          cell = 13
          gap = 3
          step = cell + gap

          left = 42
          top = 32

          # Build continuous 7-day calendar
          dates = []
          current = start

          while current <= today:
              dates.append(current)
              current += datetime.timedelta(days=1)

          # Align first day to Monday
          first_monday = start - datetime.timedelta(days=start.weekday())

          weeks = []
          current = first_monday

          while current <= today:
              weeks.append(current)
              current += datetime.timedelta(days=7)

          width = left + len(weeks) * step + 10
          height = top + 7 * step + 45

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" '
              f'viewBox="0 0 {width} {height}">'
          )

          svg.append(
              '<rect width="100%" height="100%" fill="#0d1117" rx="8"/>'
          )

          # Month labels
          previous_month = None

          for week_index, monday in enumerate(weeks):
              month = monday.month

              if month != previous_month:
                  month_name = monday.strftime("%b")

                  svg.append(
                      f'<text x="{left + week_index * step}" y="17" '
                      f'font-family="Arial, sans-serif" '
                      f'font-size="11" fill="#8b949e">'
                      f'{month_name}</text>'
                  )

                  previous_month = month

          # Weekday labels
          labels = {
              0: "Mon",
              2: "Wed",
              4: "Fri"
          }

          for weekday, label in labels.items():
              y = top + weekday * step + 10

              svg.append(
                  f'<text x="0" y="{y}" '
                  f'font-family="Arial, sans-serif" '
                  f'font-size="10" fill="#8b949e">'
                  f'{label}</text>'
              )

          # Contribution cells
          for week_index, monday in enumerate(weeks):

              for weekday in range(7):

                  date = monday + datetime.timedelta(days=weekday)

                  if date < start or date > today:
                      continue

                  count = all_days.get(date.isoformat(), 0)

                  # GitHub-like contribution intensity
                  if count == 0:
                      color = "#161b22"
                  elif count <= 2:
                      color = "#0e4429"
                  elif count <= 5:
                      color = "#006d32"
                  elif count <= 10:
                      color = "#26a641"
                  else:
                      color = "#39d353"

                  x = left + week_index * step
                  y = top + weekday * step

                  tooltip = (
                      f"{count} combined contribution"
                      f"{'s' if count != 1 else ''} on {date}"
                  )

                  svg.append(
                      f'<rect x="{x}" y="{y}" '
                      f'width="{cell}" height="{cell}" '
                      f'rx="2" ry="2" fill="{color}">'
                      f'<title>{html.escape(tooltip)}</title>'
                      f'</rect>'
                  )

          # Combined total
          svg.append(
              f'<text x="{left}" y="{height - 22}" '
              f'font-family="Arial, sans-serif" '
              f'font-size="12" fill="#8b949e">'
              f'{combined_total} combined contributions in the last year'
              f'</text>'
          )

          # Breakdown
          breakdown = (
              f"Personal: {totals['vk26kumar']}  •  "
              f"Professional: {totals['vishalk-spektra']}"
          )

          svg.append(
              f'<text x="{left}" y="{height - 6}" '
              f'font-family="Arial, sans-serif" '
              f'font-size="10" fill="#8b949e">'
              f'{html.escape(breakdown)}'
              f'</text>'
          )

          # Legend
          legend_x = width - 170
          legend_y = height - 27

          svg.append(
              f'<text x="{legend_x - 32}" y="{legend_y + 10}" '
              f'font-family="Arial, sans-serif" '
              f'font-size="10" fill="#8b949e">Less</text>'
          )

          legend_colors = [
              "#161b22",
              "#0e4429",
              "#006d32",
              "#26a641",
              "#39d353"
          ]

          for i, color in enumerate(legend_colors):
              x = legend_x + i * 16

              svg.append(
                  f'<rect x="{x}" y="{legend_y}" '
                  f'width="12" height="12" rx="2" '
                  f'fill="{color}"/>'
              )

          svg.append(
              f'<text x="{legend_x + 5 * 16 + 3}" '
              f'y="{legend_y + 10}" '
              f'font-family="Arial, sans-serif" '
              f'font-size="10" fill="#8b949e">More</text>'
          )

          svg.append("</svg>")

          with open(OUTPUT, "w", encoding="utf-8") as f:
              f.write("\n".join(svg))

          print(f"Created {OUTPUT}")
          PY

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/combined-contributions.svg

          git diff --cached --quiet || git commit -m "Update combined contribution graph"

          git push
